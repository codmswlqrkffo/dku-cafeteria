<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단국대 학식당 — 현황판</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#003DA5;--gl:#EEF3FF;--gm:#6B8FD4;--am:#c97c2a;--al:#fef3e2;--rd:#c0392b;--rl:#fdf0ef;--bg:#f5f6fa;--s:#fff;--s2:#eef0f7;--b:#dde1f0;--t:#0d1a3a;--t2:#4a5580;--t3:#8e97b8;--r:14px;--rs:10px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
nav{background:var(--g);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,61,165,.25)}
.logo{display:flex;align-items:center;gap:10px}
.logo-ic{width:48px;height:30px;flex-shrink:0}
.logo-t{font-size:14px;font-weight:700;color:#fff}
.logo-s{font-size:10px;color:rgba(255,255,255,.65)}
.nav-r{display:flex;align-items:center;gap:10px}
.nav-time{font-family:'DM Mono',monospace;font-size:13px;color:rgba(255,255,255,.7)}
.live-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#fff;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.3)}
.live-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}
.main{max-width:800px;margin:0 auto;padding:20px}
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.sum-card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:16px;text-align:center}
.sum-val{font-size:28px;font-weight:700;font-family:'DM Mono',monospace;line-height:1.2}
.sum-label{font-size:11px;color:var(--t3);margin-top:4px}
.section{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:18px;margin-bottom:16px}
.section-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title span{font-size:12px;font-weight:400;color:var(--t3)}
.zone-block{margin-bottom:16px}.zone-block:last-child{margin-bottom:0}
.zone-name{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.seat-chips{display:flex;flex-wrap:wrap;gap:6px}
.s-chip{padding:7px 10px;border:1px solid var(--b);border-radius:var(--rs);font-size:12px;font-weight:700;text-align:center;min-width:52px;background:var(--s);color:var(--t2)}
.s-chip .st{font-size:9px;font-weight:400;display:block;opacity:.7;margin-top:1px}
.s-chip.occ{background:var(--g);border-color:var(--g);color:#fff}.s-chip.occ .st{opacity:.8}
.s-chip.exp{background:var(--al);border-color:var(--am);color:var(--am)}
.seat-legend{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.sl-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3)}
.sl-dot{width:10px;height:10px;border-radius:3px}
.cong-list{display:flex;flex-direction:column;gap:8px}
.cong-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--s2);border-radius:var(--rs)}
.cong-name{font-size:14px;font-weight:700;min-width:80px}
.cong-bar-wrap{flex:1;height:8px;background:var(--b);border-radius:4px;overflow:hidden}
.cong-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.cong-bar-fill.low{background:var(--g)}.cong-bar-fill.mid{background:var(--am)}.cong-bar-fill.high{background:var(--rd)}.cong-bar-fill.none{background:var(--b)}
.cong-right{text-align:right;min-width:72px}
.cong-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block}
.cong-badge.low{background:var(--gl);color:var(--g)}.cong-badge.mid{background:var(--al);color:var(--am)}.cong-badge.high{background:var(--rl);color:var(--rd)}.cong-badge.none{background:var(--s2);color:var(--t3)}
.cong-wait{font-size:12px;color:var(--t3);margin-top:2px;font-family:'DM Mono',monospace}
.updated{font-size:11px;color:var(--t3);text-align:center;padding:12px 0}
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="data.js"></script>
<script src="firebase.js"></script>

<nav>
  <div class="logo">
    <svg class="logo-ic" viewBox="0 0 72 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 8L2 36L11 36C19.5 36 25.5 30.5 25.5 22C25.5 13.5 19.5 8 11 8Z M8 13.5L10.5 13.5C15.5 13.5 18.5 17 18.5 22C18.5 27 15.5 30.5 10.5 30.5L8 30.5Z" fill="white"/>
      <path d="M29 8L29 36L35 36L35 25.5L43.5 36L50.5 36L41.5 22.5L50.5 8L43.5 8L35 20.5L35 8Z" fill="white"/>
      <path d="M54 8L54 26.5C54 30 56 32 59.5 32C63 32 65 30 65 26.5L65 8L71 8L71 26.5C71 33.5 66 37.5 59.5 37.5C53 37.5 48 33.5 48 26.5L48 8Z" fill="white"/>
      <ellipse cx="37" cy="22" rx="35" ry="10.5" stroke="white" stroke-width="1.8" fill="none" transform="rotate(-13 37 22)"/>
      <circle cx="37" cy="22" r="2.5" fill="white"/>
    </svg>
    <div>
      <div class="logo-t">단국대 학식당 현황</div>
      <div class="logo-s">죽전캠퍼스 실시간</div>
    </div>
  </div>
  <div class="nav-r">
    <div class="nav-time" id="nav-time">00:00</div>
    <div class="live-badge">LIVE</div>
  </div>
</nav>

<div class="main">
  <div class="summary-row">
    <div class="sum-card"><div class="sum-val" id="sum-empty" style="color:var(--g)">—</div><div class="sum-label">빈 자리</div></div>
    <div class="sum-card"><div class="sum-val" id="sum-occ" style="color:var(--am)">—</div><div class="sum-label">사용 중</div></div>
    <div class="sum-card"><div class="sum-val" id="sum-cong" style="font-size:18px;color:var(--t3)">—</div><div class="sum-label">평균 대기</div></div>
  </div>
  <div class="section">
    <div class="section-title">좌석 현황 <span>전체 <span id="total-seats">—</span>석</span></div>
    <div id="seat-zones"></div>
    <div class="seat-legend">
      <div class="sl-item"><div class="sl-dot" style="background:var(--s);border:1px solid var(--b)"></div>비어있음</div>
      <div class="sl-item"><div class="sl-dot" style="background:var(--g)"></div>사용중</div>
      <div class="sl-item"><div class="sl-dot" style="background:var(--al);border:1px solid var(--am)"></div>곧 만료(10분 이내)</div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">부스별 혼잡도</div>
    <div class="cong-list" id="cong-list"></div>
  </div>
  <div class="updated" id="updated-time">마지막 업데이트: —</div>
</div>

<script>
let boothState={},seatsState={};
function tick(){document.getElementById('nav-time').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}
setInterval(tick,1000);tick();
function lv(w){return w===0?'none':w<=5?'low':w<=11?'mid':'high';}
function lvL(l){return l==='none'?'대기 없음':l==='low'?'여유':l==='mid'?'보통':'혼잡';}

document.addEventListener('DOMContentLoaded',()=>{
  const ok=initFirebase();
  if(!ok)return;
  db.ref('boothState').on('value',snap=>{boothState=snap.val()||{};renderCong();renderSummary();document.getElementById('updated-time').textContent='마지막 업데이트: '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});});
  db.ref('seats').on('value',snap=>{seatsState=snap.val()||{};renderSeats();renderSummary();});
  renderSeats();renderCong();renderSummary();
});

function renderSummary(){
  const total=TABLES.length;
  const occ=TABLES.filter(t=>seatsState[t.id]?.occupied).length;
  const empty=total-occ;
  document.getElementById('sum-empty').textContent=empty;
  document.getElementById('sum-occ').textContent=occ;
  document.getElementById('total-seats').textContent=total;
  const active=BOOTHS.filter(b=>boothState[b.id]?.orders>0);
  if(active.length){const avg=Math.round(active.reduce((a,b)=>a+(boothState[b.id]?.wait||0),0)/active.length);const l=lv(avg);const el=document.getElementById('sum-cong');el.textContent=avg+'분';el.style.color=l==='low'?'var(--g)':l==='mid'?'var(--am)':'var(--rd)';}
  else{document.getElementById('sum-cong').textContent='—';document.getElementById('sum-cong').style.color='var(--t3)';}
}

function renderSeats(){
  const zones={};TABLES.forEach(t=>{if(!zones[t.zone])zones[t.zone]=[];zones[t.zone].push(t);});
  const zl={A:'A구역 — 1인석',B:'B구역 — 2인석',C:'C구역 — 4인석',D:'D구역 — 6인석'};
  document.getElementById('seat-zones').innerHTML=Object.entries(zones).map(([z,tables])=>`<div class="zone-block"><div class="zone-name">${zl[z]||z}</div><div class="seat-chips">${tables.map(t=>{const s=seatsState[t.id];const occ=s?.occupied;const rem=occ&&s.endTs?Math.max(0,Math.floor((s.endTs-Date.now())/60000)):null;const exp=rem!==null&&rem<=10;return`<div class="s-chip${occ?(exp?' exp':' occ'):''}">${t.id}<span class="st">${occ?(exp?rem+'분':'사용중'):'빈자리'}</span></div>`;}).join('')}</div></div>`).join('');
}

function renderCong(){
  document.getElementById('cong-list').innerHTML=BOOTHS.map(b=>{const s=boothState[b.id];const hasData=!!s&&(s.orders>0);const w=hasData?(s.wait||0):0;const l=lv(w);const pct=hasData?Math.min(100,Math.round((w/22)*100)):0;return`<div class="cong-row"><div class="cong-name">${b.name}</div><div class="cong-bar-wrap"><div class="cong-bar-fill ${l}" style="width:${pct}%"></div></div><div class="cong-right"><div class="cong-badge ${l}">${lvL(l)}</div><div class="cong-wait">${hasData?w+'분 대기':'—'}</div></div></div>`;}).join('');
}

setInterval(()=>{if(Object.keys(seatsState).length>0)renderSeats();},30000);
</script>
</body>
</html>
