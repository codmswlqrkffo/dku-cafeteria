<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>단국대 학식당 주문</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1a7a5e;--gl:#e8f5f0;--gm:#4caf8a;--am:#c97c2a;--al:#fef3e2;--rd:#c0392b;--rl:#fdf0ef;--bg:#f5f3ee;--s:#fff;--s2:#f0ede6;--b:#e0dbd2;--t:#1a1814;--t2:#6b6560;--t3:#a09b94;--r:14px;--rs:10px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;max-width:480px;margin:0 auto}

.conn-bar{padding:6px 18px;font-size:11px;display:flex;align-items:center;gap:6px;background:var(--al);color:var(--am);border-bottom:1px solid #f5d5a0}
.conn-bar.ok{background:var(--gl);border-color:#b3dfc9;color:var(--g)}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--am);flex-shrink:0;animation:blink 1s infinite}
.conn-bar.ok .conn-dot{background:var(--g);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.hd{background:var(--s);border-bottom:1px solid var(--b);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hd-table{font-size:20px;font-weight:700}.hd-sub{font-size:11px;color:var(--t3);margin-top:1px}
.hd-right{text-align:right}
.cong-mini{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;display:inline-block}
.cong-mini.low{background:var(--gl);color:var(--g)}.cong-mini.mid{background:var(--al);color:var(--am)}.cong-mini.high{background:var(--rl);color:var(--rd)}.cong-mini.none{background:var(--s2);color:var(--t3)}
.hd-clock{font-size:11px;color:var(--t3);font-family:'DM Mono',monospace;margin-top:3px}

.timer-bar{background:var(--s);border-bottom:1px solid var(--b);padding:9px 18px;display:flex;align-items:center;gap:10px}
.timer-label{font-size:11px;color:var(--t2);white-space:nowrap}
.timer-val{font-size:15px;font-weight:700;font-family:'DM Mono',monospace;color:var(--g);min-width:44px;white-space:nowrap}
.timer-val.warn{color:var(--am)}.timer-val.danger{color:var(--rd)}
.timer-prog{flex:1;height:5px;background:var(--b);border-radius:3px;overflow:hidden}
.timer-fill{height:100%;border-radius:3px;background:var(--g);transition:width 1s linear}
.timer-fill.warn{background:var(--am)}.timer-fill.danger{background:var(--rd)}
.extend-btn{padding:5px 11px;border:1px solid var(--g);border-radius:20px;background:var(--gl);color:var(--g);font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.extend-btn:active{background:var(--g);color:#fff}

.steps{display:flex;align-items:center;padding:10px 18px;background:var(--s);border-bottom:1px solid var(--b)}
.step{flex:1;text-align:center;font-size:11px;color:var(--t3)}
.step.active{color:var(--g);font-weight:700}.step.done{color:var(--gm)}
.step-num{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--b);background:var(--s);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin:0 auto 3px}
.step.active .step-num{border-color:var(--g);background:var(--g);color:#fff}
.step.done .step-num{border-color:var(--gm);background:var(--gm);color:#fff}
.step-line{flex:none;width:36px;height:1px;background:var(--b);margin-bottom:22px}
.step-line.done{background:var(--gm)}

.booth-picker{padding:14px}
.picker-title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--t2)}
.min-notice{background:var(--al);border-radius:var(--rs);padding:8px 12px;font-size:12px;color:var(--am);margin-bottom:10px}
.booth-card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:7px;transition:all .12s}
.booth-card:active{background:var(--gl);border-color:var(--g)}
.bc-name{font-size:15px;font-weight:700}
.bc-wait{font-size:12px;margin-top:2px}
.bc-wait.low{color:var(--g)}.bc-wait.mid{color:var(--am)}.bc-wait.high{color:var(--rd)}.bc-wait.none{color:var(--t3)}

.menu-section{padding:0 14px 130px}
.booth-hd{display:flex;align-items:center;gap:10px;padding:13px 0 10px;border-bottom:1px solid var(--b);margin-bottom:2px}
.back-btn{width:32px;height:32px;border:1px solid var(--b);border-radius:var(--rs);background:var(--s);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.back-btn svg{width:15px;height:15px}
.menu-item{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--b);gap:10px}
.menu-item:last-child{border-bottom:none}
.mi-info{flex:1;min-width:0}
.mi-name-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mi-name{font-size:14px}
.badge-pop{font-size:10px;font-weight:700;background:#fff3cd;color:#856404;padding:1px 6px;border-radius:10px}
.badge-sold{font-size:10px;font-weight:700;background:var(--rl);color:var(--rd);padding:1px 6px;border-radius:10px}
.mi-price{font-size:12px;color:var(--t3);font-family:'DM Mono',monospace;margin-top:2px}
.qty-ctrl{display:flex;align-items:center;gap:7px}
.qty-btn{width:30px;height:30px;border:1px solid var(--b);border-radius:8px;background:var(--s);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.qty-btn:disabled{opacity:.3;cursor:default}
.qty-btn.add:not(:disabled):active{border-color:var(--g);color:var(--g);background:var(--gl)}
.qty-btn.sub:not(:disabled):active{border-color:var(--rd);color:var(--rd)}
.qty-num{font-size:14px;font-weight:700;min-width:18px;text-align:center;font-family:'DM Mono',monospace}

.cart-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--s);border-top:1px solid var(--b);padding:10px 14px;z-index:200}
.cart-summary{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px;align-items:center}
.min-warn{color:var(--rd);font-size:11px;font-weight:500}
.cart-tv{font-family:'DM Mono',monospace;font-weight:700;color:var(--g)}
.next-btn{width:100%;padding:13px;background:var(--g);color:#fff;border:none;border-radius:var(--rs);font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;cursor:pointer}
.next-btn:hover{background:#155f49}
.next-btn:disabled{background:var(--s2);color:var(--t3);cursor:default}

.cart-review{padding:14px 14px 130px}
.sect-title{font-size:14px;font-weight:700;margin-bottom:10px}
.ci-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--b);gap:8px}
.ci-row:last-child{border-bottom:none}
.ci-name{flex:1;font-size:13px}
.ci-qty{color:var(--t3);font-size:12px;margin-right:4px}
.ci-price{font-family:'DM Mono',monospace;font-size:12px}
.ci-rm{background:none;border:none;cursor:pointer;color:var(--t3);font-size:17px;padding:0 3px}
.ci-rm:active{color:var(--rd)}
.total-row{display:flex;justify-content:space-between;padding:12px 0 0;font-size:16px;font-weight:700;border-top:2px solid var(--t)}
.total-p{font-family:'DM Mono',monospace;color:var(--g)}
.pay-label{font-size:12px;color:var(--t3);margin:12px 0 7px;font-weight:500}
.pay-methods{display:flex;gap:7px;margin-bottom:12px}
.pay-btn2{flex:1;padding:9px 4px;border:1.5px solid var(--b);border-radius:var(--rs);background:var(--s);font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;cursor:pointer;text-align:center;color:var(--t2)}
.pay-btn2.active{border-color:var(--g);color:var(--g);background:var(--gl)}

/* SUCCESS */
.suc-screen{padding:32px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.suc-icon{width:64px;height:64px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;margin:0 auto}
.suc-icon svg{width:32px;height:32px;stroke:var(--g)}
.suc-title{font-size:22px;font-weight:700}
.suc-sub{font-size:13px;color:var(--t2);line-height:1.7}
.order-nums{display:flex;flex-direction:column;gap:8px;width:100%}
.onum-row{display:flex;align-items:center;justify-content:space-between;background:var(--s);border:1px solid var(--b);border-radius:var(--rs);padding:12px 16px;transition:all .3s}
.onum-row.done{background:var(--s2);opacity:.7}
.onum-badge{font-family:'DM Mono',monospace;font-size:22px;font-weight:700;color:var(--g);min-width:50px}
.onum-row.done .onum-badge{color:var(--t3);text-decoration:line-through}
.onum-name{flex:1;font-size:13px;text-align:left;padding:0 12px}
.onum-row.done .onum-name{color:var(--t3);text-decoration:line-through}
.onum-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.onum-status.waiting{background:var(--al);color:var(--am)}
.onum-status.ready{background:var(--gl);color:var(--g)}
.order-sum-box{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:14px;text-align:left;width:100%;font-size:13px;line-height:1.9}
.os-row{display:flex;justify-content:space-between}
.extra-btn{width:100%;padding:12px;border:1.5px solid var(--b);border-radius:var(--rs);background:var(--s);font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:var(--t2)}
.extra-btn:active{background:var(--s2)}
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="data.js"></script>
<script src="firebase.js"></script>

<div class="conn-bar" id="conn-bar">
  <div class="conn-dot"></div>
  <span id="conn-text">서버 연결 중...</span>
</div>

<header class="hd">
  <div>
    <div class="hd-table" id="hd-table">—</div>
    <div class="hd-sub" id="hd-sub"></div>
  </div>
  <div class="hd-right">
    <div class="cong-mini none" id="hd-cong">대기 중</div>
    <div class="hd-clock" id="hd-clock">00:00</div>
  </div>
</header>

<div class="timer-bar">
  <span class="timer-label">남은 시간</span>
  <span class="timer-val" id="timer-val">30:00</span>
  <div class="timer-prog"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
  <button class="extend-btn" onclick="extendTime()">+20분</button>
</div>

<div class="steps" id="steps">
  <div class="step active" id="step1"><div class="step-num">1</div>부스</div>
  <div class="step-line" id="sl1"></div>
  <div class="step" id="step2"><div class="step-num">2</div>메뉴</div>
  <div class="step-line" id="sl2"></div>
  <div class="step" id="step3"><div class="step-num">3</div>결제</div>
</div>

<div id="content"></div>
<div class="cart-bar" id="cart-bar" style="display:none"></div>

<script>
/* ── PARAMS & TABLE INFO ── */
const params = new URLSearchParams(location.search);
const tableId = params.get('id') || 'A1';
const tableInfo = TABLES.find(t => t.id === tableId) || {id:tableId,zone:'A',type:1,minOrder:1};

/* ── LIVE DATA (Firebase 구독으로 채워짐) ── */
let soldoutMap = {};    // key: "boothId::itemName" → true
let boothStateMap = {}; // key: boothId → {orders, wait, revenue, popular}
let myOrderId = null;   // 이번 세션에서 방금 결제한 주문 ID
let fbReady = false;

/* ── SESSION TIMER ── */
const SK = 'dku_sess_' + tableId;
let session;
try { session = JSON.parse(sessionStorage.getItem(SK)); } catch {}
if (!session) {
  session = { startTs: Date.now(), endTs: Date.now() + DEFAULT_TIME * 60000, extended: 0 };
  sessionStorage.setItem(SK, JSON.stringify(session));
}
function saveSession() { sessionStorage.setItem(SK, JSON.stringify(session)); }

function extendTime() {
  session.endTs += EXTEND_TIME * 60000;
  session.extended = (session.extended || 0) + 1;
  saveSession();
  if (fbReady) setSeat(tableId, { occupied: true, since: session.startTs, endTs: session.endTs });
}

function updateTimer() {
  const rem = Math.max(0, session.endTs - Date.now());
  const total = (DEFAULT_TIME + (session.extended||0) * EXTEND_TIME) * 60000;
  const pct = (rem / total) * 100;
  const mins = Math.floor(rem / 60000);
  const secs = Math.floor((rem % 60000) / 1000);
  const el = document.getElementById('timer-val');
  const fill = document.getElementById('timer-fill');
  if (el) { el.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`; el.className = 'timer-val'+(mins<5?' danger':mins<10?' warn':''); }
  if (fill) { fill.style.width = pct+'%'; fill.className = 'timer-fill'+(mins<5?' danger':mins<10?' warn':''); }
  if (rem === 0) showExpired();
}
setInterval(updateTimer, 1000); updateTimer();

function showExpired() {
  document.getElementById('steps').style.display = 'none';
  document.getElementById('cart-bar').style.display = 'none';
  document.getElementById('content').innerHTML = `
    <div class="suc-screen">
      <div class="suc-icon" style="background:var(--rl)"><svg viewBox="0 0 24 24" fill="none" stroke="var(--rd)" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg></div>
      <div class="suc-title" style="color:var(--rd)">이용시간 종료</div>
      <div class="suc-sub">이용시간이 만료되었습니다.<br>자리를 비워주시면 감사합니다.</div>
    </div>`;
}

/* ── HEADER ── */
document.getElementById('hd-table').textContent = '테이블 ' + tableId;
document.getElementById('hd-sub').textContent = tableInfo.type + '인석';
function updateClock() { document.getElementById('hd-clock').textContent = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }
setInterval(updateClock, 10000); updateClock();

function updateCongHeader() {
  const keys = Object.keys(boothStateMap);
  const el = document.getElementById('hd-cong');
  if (!keys.length) { el.className='cong-mini none'; el.textContent='주문 없음'; return; }
  const waits = keys.map(k => boothStateMap[k]?.wait || 0);
  const avg = Math.round(waits.reduce((a,b)=>a+b,0)/waits.length);
  const l = avg<=5?'low':avg<=11?'mid':'high';
  el.className = 'cong-mini ' + l;
  el.textContent = '● '+(l==='low'?'여유':l==='mid'?'보통':'혼잡')+' · '+avg+'분';
}

/* ── FIREBASE ── */
window.addEventListener('load', () => {
  const ok = initFirebase();
  const bar = document.getElementById('conn-bar');
  if (!ok) {
    bar.style.cssText = 'background:var(--rl);color:var(--rd);padding:6px 18px;font-size:11px';
    bar.textContent = '⚠ Firebase 미설정';
    return;
  }
  fbReady = true;

  // 연결 상태
  db.ref('.info/connected').on('value', snap => {
    const c = snap.val();
    bar.className = 'conn-bar' + (c?' ok':'');
    bar.innerHTML = `<div class="conn-dot"></div><span>${c?'실시간 연결됨':'재연결 중...'}</span>`;
  });

  // 좌석 등록
  setSeat(tableId, { occupied: true, since: session.startTs, endTs: session.endTs });

  // ── 품절 실시간 구독 ── Firebase 값 변경 즉시 반영
  db.ref('soldout').on('value', snap => {
    soldoutMap = snap.val() || {};
    // 현재 메뉴 화면이면 즉시 다시 렌더
    if (currentBoothId) renderMenu(currentBoothId);
  });

  // ── 부스 상태 실시간 구독 ──
  db.ref('boothState').on('value', snap => {
    boothStateMap = snap.val() || {};
    updateCongHeader();
    // 부스 선택 화면이면 대기시간 업데이트
    if (!currentBoothId) renderBooth();
    else {
      const waitEl = document.getElementById('booth-wait-label');
      if (waitEl) {
        const w = boothStateMap[currentBoothId]?.wait || 0;
        const l = w===0?'none':w<=5?'low':w<=11?'mid':'high';
        waitEl.className = 'bc-wait ' + l;
        waitEl.textContent = w===0?'대기 없음':'● '+(l==='low'?'여유':l==='mid'?'보통':'혼잡')+' · 약 '+w+'분 대기';
      }
    }
  });

  // ── 내 주문 실시간 구독 (완료 상태 수신) ──
  db.ref('orders').on('value', snap => {
    if (!myOrderId) return;
    const data = snap.val() || {};
    const order = data[myOrderId];
    if (order) updateSuccessScreen(order);
  });

  renderBooth();
});

/* ── STEP ── */
function setStep(n) {
  [1,2,3].forEach(i => { document.getElementById('step'+i).className='step'+(i===n?' active':i<n?' done':''); });
  [1,2].forEach(i => { const l=document.getElementById('sl'+i); if(l) l.className='step-line'+(i<n?' done':''); });
}

/* ── CART STATE ── */
let cart = {}, currentBoothId = null, payMethod = 'kakao';
function cartCount() {
  let cnt=0, total=0;
  Object.values(cart).forEach(b => Object.values(b).forEach(it => { cnt+=it.qty; total+=it.p*it.qty; }));
  return {cnt, total};
}

/* ── STEP 1: BOOTH ── */
function renderBooth() {
  if (currentBoothId) return; // 메뉴 화면 중이면 무시
  setStep(1);
  document.getElementById('cart-bar').style.display = 'none';
  const minO = tableInfo.minOrder;
  document.getElementById('content').innerHTML = `
    <div class="booth-picker">
      <div class="picker-title">어느 부스에서 주문하시겠어요?</div>
      ${minO>1?`<div class="min-notice">⚠ ${tableInfo.type}인석 최소 ${minO}개 주문</div>`:''}
      ${BOOTHS.map(b => {
        const s = boothStateMap[b.id];
        const w = s?.wait || 0;
        const hasOrders = !!s;
        const l = !hasOrders?'none':w<=5?'low':w<=11?'mid':'high';
        const lbl = !hasOrders?'대기 없음':w<=5?'여유':w<=11?'보통':'혼잡';
        return `<div class="booth-card" onclick="selectBooth('${b.id}')">
          <div>
            <div class="bc-name">${b.name}</div>
            <div class="bc-wait ${l}">${!hasOrders?'대기 없음':'● '+lbl+' · 약 '+w+'분'}</div>
          </div>
          <span style="font-size:20px;color:var(--t3)">›</span>
        </div>`;
      }).join('')}
    </div>`;
}

/* ── STEP 2: MENU ── */
function selectBooth(id) {
  currentBoothId = id;
  if (!cart[id]) cart[id] = {};
  renderMenu(id);
}

function renderMenu(id) {
  setStep(2);
  const b = BOOTHS.find(x => x.id === id);
  const s = boothStateMap[id];
  const w = s?.wait || 0;
  const hasOrders = !!s;
  const l = !hasOrders?'none':w<=5?'low':w<=11?'mid':'high';
  const popular = s?.popular || {};

  document.getElementById('content').innerHTML = `
    <div class="menu-section">
      <div class="booth-hd">
        <button class="back-btn" onclick="currentBoothId=null;cart={};renderBooth()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div>
          <div style="font-size:16px;font-weight:700">${b.name}</div>
          <div id="booth-wait-label" class="bc-wait ${l}">${!hasOrders?'대기 없음':'● '+(l==='low'?'여유':l==='mid'?'보통':'혼잡')+' · 약 '+w+'분 대기'}</div>
        </div>
      </div>
      ${b.items.map((item,i) => {
        const qty = cart[id][item.n]?.qty || 0;
        const key = id+'::'+item.n;
        const isSold = soldoutMap[key] === true;
        const popCnt = popular[item.n] || 0;
        const isPop = popCnt >= POPULAR_THRESHOLD && !isSold;
        return `<div class="menu-item" id="mi-row-${i}">
          <div class="mi-info">
            <div class="mi-name-row">
              <span class="mi-name">${item.n}</span>
              ${isPop?'<span class="badge-pop">🔥 인기</span>':''}
              ${isSold?'<span class="badge-sold">품절</span>':''}
            </div>
            <div class="mi-price">${item.p.toLocaleString()}원</div>
          </div>
          ${isSold
            ? '<div style="font-size:12px;color:var(--rd);font-weight:500;flex-shrink:0">품절</div>'
            : `<div class="qty-ctrl">
                <button class="qty-btn sub" id="sub-${i}" onclick="chgQty('${id}',${i},'${item.n}',${item.p},-1)" ${qty===0?'disabled':''}>−</button>
                <span class="qty-num" id="qn-${i}">${qty}</span>
                <button class="qty-btn add" onclick="chgQty('${id}',${i},'${item.n}',${item.p},1)">+</button>
              </div>`}
        </div>`;
      }).join('')}
    </div>`;
  document.getElementById('cart-bar').style.display = 'block';
  updateCartBar();
}

function chgQty(bid, idx, name, price, delta) {
  if (soldoutMap[bid+'::'+name] === true && delta > 0) { alert('방금 품절 처리된 메뉴입니다.'); renderMenu(bid); return; }
  if (!cart[bid]) cart[bid] = {};
  const nw = Math.max(0, (cart[bid][name]?.qty||0) + delta);
  if (nw===0) delete cart[bid][name]; else cart[bid][name]={n:name,p:price,qty:nw};
  const el=document.getElementById('qn-'+idx); if(el) el.textContent=nw;
  const sub=document.getElementById('sub-'+idx); if(sub) sub.disabled=nw===0;
  updateCartBar();
}

function updateCartBar() {
  const {cnt,total} = cartCount();
  const minO = tableInfo.minOrder, ok = cnt>=minO;
  document.getElementById('cart-bar').innerHTML = `
    <div class="cart-summary">
      <span class="${ok?'cart-count':'min-warn'}">${cnt<minO?`최소 ${minO}개 필요 (현재 ${cnt}개)`:cnt+'개 선택'}</span>
      <span class="cart-tv">${total.toLocaleString()}원</span>
    </div>
    <button class="next-btn" ${!ok?'disabled':''} onclick="goCart()">주문 확인하기</button>`;
}

/* ── STEP 3: REVIEW ── */
function goCart() {
  setStep(3);
  document.getElementById('cart-bar').style.display = 'none';
  const b = BOOTHS.find(x=>x.id===currentBoothId);
  const items = Object.values(cart[currentBoothId]||{});
  const total = items.reduce((a,i)=>a+i.p*i.qty,0);
  document.getElementById('content').innerHTML = `
    <div class="cart-review">
      <div class="sect-title">${b.name} 주문 내역</div>
      ${items.map(it=>`
        <div class="ci-row">
          <span class="ci-name">${it.n}</span>
          <span class="ci-qty">×${it.qty}</span>
          <span class="ci-price">${(it.p*it.qty).toLocaleString()}원</span>
          <button class="ci-rm" onclick="rmItem('${it.n}')">×</button>
        </div>`).join('')}
      <div class="total-row"><span>합계</span><span class="total-p">${total.toLocaleString()}원</span></div>
      <div class="pay-label">결제 수단</div>
      <div class="pay-methods">
        <button class="pay-btn2 active" id="pm-kakao" onclick="setPay('kakao')">카카오페이</button>
        <button class="pay-btn2" id="pm-toss" onclick="setPay('toss')">토스</button>
        <button class="pay-btn2" id="pm-card" onclick="setPay('card')">신용카드</button>
      </div>
      <button class="next-btn" onclick="doPayment()">결제하기 · ${total.toLocaleString()}원</button>
    </div>`;
  payMethod='kakao';
}

function setPay(m) {
  payMethod=m;
  ['kakao','toss','card'].forEach(x=>{ const el=document.getElementById('pm-'+x); if(el) el.className='pay-btn2'+(x===m?' active':''); });
}

function rmItem(name) {
  if(cart[currentBoothId]) delete cart[currentBoothId][name];
  const {cnt}=cartCount();
  if(cnt<tableInfo.minOrder){renderMenu(currentBoothId);}else{goCart();}
}

/* ── PAYMENT ── */
async function doPayment() {
  if (!fbReady) { alert('서버에 연결되지 않았습니다. 잠시 후 다시 시도해주세요.'); return; }
  const b = BOOTHS.find(x=>x.id===currentBoothId);
  const items = Object.values(cart[currentBoothId]||{});
  if (!items.length) return;

  // 품절 최종 확인
  const soldItems = items.filter(it => soldoutMap[currentBoothId+'::'+it.n]===true);
  if (soldItems.length) { alert('품절된 메뉴가 포함되어 있습니다:\n'+soldItems.map(i=>i.n).join(', ')); renderMenu(currentBoothId); return; }

  const total = items.reduce((a,i)=>a+i.p*i.qty,0);
  const now = new Date();
  const timeStr = now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});

  // 아이템별 번호 채번 — 트랜잭션으로 순차 증가
  const baseNum = await nextOrderNum();
  // 아이템이 여러 개면 추가로 카운터 증가
  if (items.length > 1) {
    await REF.counter().set(baseNum + items.length - 1);
  }

  // items 배열 구성 — 인덱스 기반으로 done 처리되므로 배열 순서 유지
  const assignedItems = items.map((it, i) => ({
    n: it.n,
    p: it.p,
    qty: it.qty,
    num: baseNum + i,
    done: false
  }));

  const orderId = 'ord_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  const order = {
    id: orderId,
    booth: b.name,
    boothId: currentBoothId,
    table: tableId,
    items: assignedItems,  // 배열로 저장
    total,
    time: timeStr,
    pay: payMethod,
    ts: Date.now()
  };

  await saveOrder(order);
  myOrderId = orderId; // 구독 시 이 ID의 변경사항만 추적

  // 부스 상태 업데이트
  const cur = boothStateMap[currentBoothId] || {orders:0, wait:0, revenue:0, popular:{}};
  const popular = {...(cur.popular||{})};
  assignedItems.forEach(it => { popular[it.n] = (popular[it.n]||0) + it.qty; });
  await updateBoothState(currentBoothId, {
    orders: (cur.orders||0) + 1,
    revenue: (cur.revenue||0) + total,
    wait: Math.min(25, ((cur.orders||0)+1) * 2),  // 주문 1건당 2분 증가
    popular
  });

  // UI 초기화 후 성공화면
  cart = {}; currentBoothId = null;
  document.getElementById('steps').style.display = 'none';
  document.getElementById('cart-bar').style.display = 'none';
  showSuccessScreen(order);
}

/* ── SUCCESS SCREEN ── */
function showSuccessScreen(order) {
  document.getElementById('content').innerHTML = `
    <div class="suc-screen">
      <div class="suc-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="suc-title">주문 완료!</div>
      <div class="suc-sub">번호가 완료로 바뀌면 수령하세요</div>
      <div class="order-nums" id="onum-list">
        ${order.items.map((it,i) => `
          <div class="onum-row${it.done?' done':''}" id="onum-row-${i}">
            <span class="onum-badge">${it.num}</span>
            <span class="onum-name">${it.n} ×${it.qty}</span>
            <span class="onum-status ${it.done?'ready':'waiting'}">${it.done?'✓ 완료':'준비중'}</span>
          </div>`).join('')}
      </div>
      <div class="order-sum-box">
        ${order.items.map(it=>`<div class="os-row"><span>${it.n} ×${it.qty}</span><span style="font-family:'DM Mono',monospace">${(it.p*it.qty).toLocaleString()}원</span></div>`).join('')}
        <div class="os-row" style="font-weight:700;border-top:1px solid var(--b);margin-top:7px;padding-top:7px">
          <span>합계</span><span style="font-family:'DM Mono',monospace;color:var(--g)">${order.total.toLocaleString()}원</span>
        </div>
        <div style="font-size:11px;color:var(--t3);margin-top:4px">테이블 ${tableId} · ${order.time}</div>
      </div>
      <button class="extra-btn" onclick="resetOrder()">추가 주문하기</button>
    </div>`;
}

// Firebase 구독에서 내 주문이 업데이트되면 호출
function updateSuccessScreen(order) {
  order.items.forEach((it, i) => {
    const row = document.getElementById('onum-row-'+i);
    if (!row) return;
    row.className = 'onum-row' + (it.done?' done':'');
    row.querySelector('.onum-status').className = 'onum-status '+(it.done?'ready':'waiting');
    row.querySelector('.onum-status').textContent = it.done?'✓ 완료':'준비중';
  });
}

function resetOrder() {
  myOrderId = null;
  document.getElementById('steps').style.display = 'flex';
  cart = {}; currentBoothId = null;
  renderBooth();
}
</script>
