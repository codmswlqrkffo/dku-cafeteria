<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>DKU 학식당 주문</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest-table.json">
  <meta name="theme-color" content="#003DA5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DKU 학식당">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --g:#003DA5;--gl:#EEF3FF;--gm:#6B8FD4;
  --am:#c97c2a;--al:#fef3e2;
  --rd:#c0392b;--rl:#fdf0ef;
  --bg:#f5f6fa;--s:#fff;--s2:#eef0f7;
  --b:#dde1f0;--t:#0d1a3a;--t2:#4a5580;--t3:#8e97b8;
  --r:14px;--rs:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;max-width:480px;margin:0 auto}

.conn-bar{padding:6px 18px;font-size:11px;display:flex;align-items:center;gap:6px;background:#fef6e4;color:var(--am);border-bottom:1px solid #f5d5a0}
.conn-bar.ok{background:var(--gl);border-color:#b3c8f0;color:var(--g)}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--am);flex-shrink:0;animation:blink 1s infinite}
.conn-bar.ok .conn-dot{background:var(--g);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.hd{background:var(--g);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,61,165,.18)}
.hd-table{font-size:20px;font-weight:700;color:#fff}
.hd-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:1px}
.hd-right{text-align:right}
.cong-mini{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;display:inline-block}
.cong-mini.low{background:rgba(255,255,255,.2);color:#fff}
.cong-mini.mid{background:var(--al);color:var(--am)}
.cong-mini.high{background:var(--rl);color:var(--rd)}
.cong-mini.none{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8)}
.hd-clock{font-size:11px;color:rgba(255,255,255,.65);font-family:'DM Mono',monospace;margin-top:3px}

.timer-bar{background:var(--s);border-bottom:1px solid var(--b);padding:9px 18px;display:flex;align-items:center;gap:10px}
.timer-label{font-size:11px;color:var(--t2);white-space:nowrap}
.timer-val{font-size:15px;font-weight:700;font-family:'DM Mono',monospace;color:var(--g);min-width:44px;white-space:nowrap}
.timer-val.warn{color:var(--am)}.timer-val.danger{color:var(--rd)}
.timer-prog{flex:1;height:5px;background:var(--b);border-radius:3px;overflow:hidden}
.timer-fill{height:100%;border-radius:3px;background:var(--g);transition:width 1s linear}
.timer-fill.warn{background:var(--am)}.timer-fill.danger{background:var(--rd)}
.extend-btn{padding:5px 11px;border:1px solid var(--g);border-radius:20px;background:var(--gl);color:var(--g);font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.extend-btn:active{background:var(--g);color:#fff}

.steps{display:flex;align-items:center;padding:10px 18px;background:var(--s);border-bottom:1px solid var(--b)}
.step{flex:1;text-align:center;font-size:11px;color:var(--t3)}
.step.active{color:var(--g);font-weight:700}.step.done{color:var(--gm)}
.step-num{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--b);background:var(--s);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin:0 auto 3px}
.step.active .step-num{border-color:var(--g);background:var(--g);color:#fff}
.step.done .step-num{border-color:var(--gm);background:var(--gm);color:#fff}
.step-line{flex:none;width:36px;height:1px;background:var(--b);margin-bottom:22px}
.step-line.done{background:var(--gm)}

.booth-picker{padding:14px}
.picker-title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--t2)}
.min-notice{background:var(--al);border-radius:var(--rs);padding:8px 12px;font-size:12px;color:var(--am);margin-bottom:10px}
.booth-card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:7px;transition:all .12s}
.booth-card:active{background:var(--gl);border-color:var(--g)}
.bc-name{font-size:15px;font-weight:700}
.bc-wait{font-size:12px;margin-top:2px}
.bc-wait.low{color:var(--g)}.bc-wait.mid{color:var(--am)}.bc-wait.high{color:var(--rd)}.bc-wait.none{color:var(--t3)}

.menu-section{padding:0 14px 180px}
.booth-hd{display:flex;align-items:center;gap:10px;padding:13px 0 10px;border-bottom:1px solid var(--b);margin-bottom:2px}
.back-btn{width:32px;height:32px;border:1px solid var(--b);border-radius:var(--rs);background:var(--s);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.back-btn svg{width:15px;height:15px}
.menu-item{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--b);gap:10px}
.menu-item:last-child{border-bottom:none}
.mi-info{flex:1;min-width:0}
.mi-name-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mi-name{font-size:14px}
.badge-pop{font-size:10px;font-weight:700;background:#fff3cd;color:#856404;padding:1px 6px;border-radius:10px}
.badge-sold{font-size:10px;font-weight:700;background:var(--rl);color:var(--rd);padding:1px 6px;border-radius:10px}
.mi-price{font-size:12px;color:var(--t3);font-family:'DM Mono',monospace;margin-top:2px}
.qty-ctrl{display:flex;align-items:center;gap:7px}
.qty-btn{width:30px;height:30px;border:1px solid var(--b);border-radius:8px;background:var(--s);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.qty-btn:disabled{opacity:.3;cursor:default}
.qty-btn.add:not(:disabled):active{border-color:var(--g);color:var(--g);background:var(--gl)}
.qty-btn.sub:not(:disabled):active{border-color:var(--rd);color:var(--rd)}
.qty-num{font-size:14px;font-weight:700;min-width:18px;text-align:center;font-family:'DM Mono',monospace}

/* TRACKER */
.order-tracker{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--s);border-top:2px solid var(--b);z-index:300;transition:all .3s}
.order-tracker.has-pending{border-top-color:var(--am)}
.order-tracker.all-done{border-top-color:var(--g)}
.tracker-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;user-select:none}
.tracker-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.tracker-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.tracker-badge.pending{background:var(--al);color:var(--am)}
.tracker-badge.done{background:var(--gl);color:var(--g)}
.tracker-toggle{font-size:11px;color:var(--t3)}
.tracker-body{padding:0 16px;max-height:0;overflow:hidden;transition:max-height .3s ease}
.tracker-body.open{max-height:300px;padding-bottom:14px}
.tracker-order-group{margin-bottom:10px}
.tog-booth{font-size:11px;font-weight:700;color:var(--t3);margin-bottom:5px}
.tog-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--b)}
.tog-item:last-child{border-bottom:none}
.tog-num{font-family:'DM Mono',monospace;font-size:18px;font-weight:700;min-width:40px;color:var(--g)}
.tog-num.done{color:var(--t3);text-decoration:line-through}
.tog-name{flex:1;font-size:12px}
.tog-item.done-row .tog-name{color:var(--t3);text-decoration:line-through}
.tog-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.tog-status.waiting{background:var(--al);color:var(--am)}
.tog-status.ready{background:var(--gl);color:var(--g)}
.tracker-clear{width:100%;padding:8px;border:1px solid var(--b);border-radius:var(--rs);background:var(--s2);font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;cursor:pointer;color:var(--t2);margin-top:6px}

.cart-bar{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--s);border-top:1px solid var(--b);padding:10px 14px;z-index:200}
.cart-summary{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px;align-items:center}
.min-warn{color:var(--rd);font-size:11px;font-weight:500}
.cart-tv{font-family:'DM Mono',monospace;font-weight:700;color:var(--g)}
.next-btn{width:100%;padding:13px;background:var(--g);color:#fff;border:none;border-radius:var(--rs);font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s}
.next-btn:hover{background:#002d7a}
.next-btn:disabled{background:var(--s2);color:var(--t3);cursor:default}

.cart-review{padding:14px 14px 180px}
.sect-title{font-size:14px;font-weight:700;margin-bottom:10px}
.ci-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--b);gap:8px}
.ci-row:last-child{border-bottom:none}
.ci-name{flex:1;font-size:13px}
.ci-qty{color:var(--t3);font-size:12px;margin-right:4px}
.ci-price{font-family:'DM Mono',monospace;font-size:12px}
.ci-rm{background:none;border:none;cursor:pointer;color:var(--t3);font-size:17px;padding:0 3px}
.ci-rm:active{color:var(--rd)}
.total-row{display:flex;justify-content:space-between;padding:12px 0 0;font-size:16px;font-weight:700;border-top:2px solid var(--t)}
.total-p{font-family:'DM Mono',monospace;color:var(--g)}
.pay-label{font-size:12px;color:var(--t3);margin:12px 0 7px;font-weight:500}
.pay-methods{display:flex;gap:7px;margin-bottom:12px}
.pay-btn2{flex:1;padding:9px 4px;border:1.5px solid var(--b);border-radius:var(--rs);background:var(--s);font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;cursor:pointer;text-align:center;color:var(--t2)}
.pay-btn2.active{border-color:var(--g);color:var(--g);background:var(--gl)}

.suc-screen{padding:32px 18px 180px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.suc-icon{width:64px;height:64px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;margin:0 auto}
.suc-icon svg{width:32px;height:32px;stroke:var(--g)}
.suc-title{font-size:22px;font-weight:700}
.suc-sub{font-size:13px;color:var(--t2);line-height:1.7}
.extra-btn{width:100%;padding:12px;border:1.5px solid var(--b);border-radius:var(--rs);background:var(--s);font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:var(--t2)}
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="data.js"></script>
<script src="firebase.js"></script>

<div id="conn-bar" class="conn-bar">
  <div class="conn-dot"></div>
  <span id="conn-text">서버 연결 중...</span>
</div>

<header class="hd">
  <div>
    <div class="hd-table" id="hd-table">—</div>
    <div class="hd-sub" id="hd-sub"></div>
  </div>
  <div class="hd-right">
    <div class="cong-mini none" id="hd-cong">대기 중</div>
    <div class="hd-clock" id="hd-clock">00:00</div>
  </div>
</header>

<div class="timer-bar">
  <span class="timer-label">남은 시간</span>
  <span class="timer-val" id="timer-val">30:00</span>
  <div class="timer-prog"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
  <button class="extend-btn" onclick="extendTime()">+20분</button>
  <button class="extend-btn" style="background:var(--rl);border-color:var(--rd);color:var(--rd)" onclick="confirmCheckout()">체크아웃</button>
</div>

<div class="steps" id="steps">
  <div class="step active" id="step1"><div class="step-num">1</div>부스</div>
  <div class="step-line" id="sl1"></div>
  <div class="step" id="step2"><div class="step-num">2</div>메뉴</div>
  <div class="step-line" id="sl2"></div>
  <div class="step" id="step3"><div class="step-num">3</div>결제</div>
</div>

<div id="content"></div>
<div class="cart-bar" id="cart-bar" style="display:none"></div>

<div class="order-tracker" id="order-tracker" style="display:none">
  <div class="tracker-header" onclick="toggleTracker()">
    <div class="tracker-title">
      <span>내 주문 현황</span>
      <span class="tracker-badge pending" id="tracker-badge">준비중</span>
    </div>
    <span class="tracker-toggle" id="tracker-toggle">▲ 펼치기</span>
  </div>
  <div class="tracker-body" id="tracker-body"></div>
</div>

<!-- 시간 만료 모달 -->
<div id="expire-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--s);border-radius:16px;padding:28px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.18)">
    <div style="width:60px;height:60px;border-radius:50%;background:var(--al);display:flex;align-items:center;justify-content:center;margin:0 auto 14px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--am)" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <div style="font-size:18px;font-weight:700;margin-bottom:8px">이용시간이 종료되었습니다</div>
    <div style="font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:20px">
      시간을 연장하시겠습니까?<br>
      <span style="font-size:12px;color:var(--t3)">연장 시 20분이 추가됩니다</span>
    </div>
    <div style="display:flex;gap:10px">
      <button onclick="doCheckout()" style="flex:1;padding:12px;border:1.5px solid var(--b);border-radius:var(--rs);background:var(--s);font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:500;cursor:pointer;color:var(--t2)">체크아웃</button>
      <button onclick="extendTime()" style="flex:1;padding:12px;border:none;border-radius:var(--rs);background:var(--g);color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer">+20분 연장</button>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const tableId = params.get('id') || 'A1';
const tableInfo = TABLES.find(t => t.id === tableId) || {id:tableId,zone:'A',type:1,minOrder:1};

const ORDER_KEY = 'dku_orders_' + tableId;
function getSavedOrderIds(){try{return JSON.parse(localStorage.getItem(ORDER_KEY))||[];}catch{return[];}}
function addSavedOrderId(id){const ids=getSavedOrderIds();if(!ids.includes(id))ids.push(id);if(ids.length>10)ids.splice(0,ids.length-10);localStorage.setItem(ORDER_KEY,JSON.stringify(ids));}
function clearSavedOrderIds(){localStorage.removeItem(ORDER_KEY);}

let expireShown=false,isAdditionalOrder=false,soldoutMap={}, boothStateMap={}, trackedOrders={}, trackerOpen=false, fbReady=false;

const SK='dku_sess_'+tableId;
let session;
try{session=JSON.parse(sessionStorage.getItem(SK));}catch{}
if(!session){session={startTs:Date.now(),endTs:Date.now()+DEFAULT_TIME*60000,extended:0};sessionStorage.setItem(SK,JSON.stringify(session));}
function saveSession(){sessionStorage.setItem(SK,JSON.stringify(session));}

function extendTime(){
  if((session.extended||0)>=1){
    alert('시간 연장은 1회만 가능합니다.');
    document.getElementById('expire-modal').style.display='none';
    doCheckout();
    return;
  }
  session.endTs+=20*60000;
  session.extended=(session.extended||0)+1;
  saveSession();
  if(fbReady)setSeat(tableId,{occupied:true,since:session.startTs,endTs:session.endTs});
  document.getElementById('expire-modal').style.display='none';
  // 타이머 바의 +20분 버튼 비활성화
  const extBtn=document.querySelector('.extend-btn');
  if(extBtn&&extBtn.textContent.includes('+20분')){
    extBtn.disabled=true;
    extBtn.style.opacity='0.4';
    extBtn.style.cursor='default';
    extBtn.title='연장은 1회만 가능합니다';
  }
}

function updateTimer(){
  // 이미 연장한 경우 버튼 비활성화 유지
  if((session.extended||0)>=1){
    const extBtn=document.querySelector('.extend-btn');
    if(extBtn&&extBtn.textContent.includes('+20분')){
      extBtn.disabled=true;extBtn.style.opacity='0.4';extBtn.style.cursor='default';
      extBtn.title='연장은 1회만 가능합니다';
    }
  }
  const rem=Math.max(0,session.endTs-Date.now());
  const total=(DEFAULT_TIME+(session.extended||0)*EXTEND_TIME)*60000;
  const pct=(rem/total)*100;
  const mins=Math.floor(rem/60000),secs=Math.floor((rem%60000)/1000);
  const el=document.getElementById('timer-val'),fill=document.getElementById('timer-fill');
  if(el){el.textContent=`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;el.className='timer-val'+(mins<5?' danger':mins<10?' warn':'');}
  if(fill){fill.style.width=pct+'%';fill.className='timer-fill'+(mins<5?' danger':mins<10?' warn':'');}
  if(rem===0&&!expireShown){expireShown=true;showExpired();}
}
setInterval(updateTimer,1000);updateTimer();

function showExpired(){
  if((session.extended||0)>=1){
    // 이미 연장한 경우 연장 버튼 없이 체크아웃만
    document.getElementById('expire-modal').innerHTML=`
      <div style="background:var(--s);border-radius:16px;padding:28px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.18)">
        <div style="width:60px;height:60px;border-radius:50%;background:var(--rl);display:flex;align-items:center;justify-content:center;margin:0 auto 14px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--rd)" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div style="font-size:18px;font-weight:700;margin-bottom:8px">이용시간이 종료되었습니다</div>
        <div style="font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:20px">
          연장 가능 횟수를 모두 사용하셨습니다.<br>
          <span style="font-size:12px;color:var(--t3)">이용해주셔서 감사합니다 😊</span>
        </div>
        <button onclick="doCheckout()" style="width:100%;padding:12px;border:none;border-radius:var(--rs);background:var(--g);color:#fff;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer">체크아웃</button>
      </div>`;
  }
  document.getElementById('expire-modal').style.display='flex';
}

function showBlockedScreen(){
  document.getElementById('steps').style.display='none';
  document.getElementById('cart-bar').style.display='none';
  document.getElementById('order-tracker').style.display='none';
  document.getElementById('content').innerHTML=`
    <div class="suc-screen">
      <div class="suc-icon" style="background:var(--s2)">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>
      <div class="suc-title" style="color:var(--t2);font-size:18px">접근이 제한된 자리입니다</div>
      <div class="suc-sub">
        이미 체크아웃된 자리입니다.<br>
        새로 이용하시려면 테이블의<br>
        <strong style="color:var(--t)">QR 코드를 다시 스캔</strong>해주세요.
      </div>
      <div style="background:var(--s2);border-radius:var(--rs);padding:12px 16px;font-size:12px;color:var(--t3);line-height:1.7;width:100%;text-align:left">
        🔒 보안 정책: 체크아웃 후 30분간 URL 직접 접속이 제한됩니다.<br>
        QR 스캔을 통해서만 새 세션을 시작할 수 있습니다.
      </div>
    </div>`;
}

function confirmCheckout(){
  if(confirm('체크아웃 하시겠습니까?\n식사가 완료되셨나요?')) {
    doCheckout();
  }
}

function doCheckout(){
  document.getElementById('expire-modal').style.display='none';
  // Firebase 좌석 상태: occupied:false + checkedOut 기록
  // occupied:false → 현황판/관리자 창에서 빈자리로 표시
  if(fbReady){
    await db.ref('seats/'+tableId).set({
      occupied: false,
      checkedOut: true,
      checkedOutAt: Date.now()
    });
  }
  // 세션 삭제
  sessionStorage.removeItem('dku_sess_'+tableId);
  // localStorage에도 체크아웃 기록 (같은 기기 빠른 재접속 차단용)
  localStorage.setItem('dku_checkout_'+tableId, Date.now().toString());
  // expireShown 초기화
  expireShown = false;
  // 종료 화면
  document.getElementById('steps').style.display='none';
  document.getElementById('cart-bar').style.display='none';
  document.getElementById('order-tracker').style.display='none';
  document.getElementById('content').innerHTML=`
    <div class="suc-screen">
      <div class="suc-icon" style="background:var(--gl)">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--g)" stroke-width="2.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <div class="suc-title">체크아웃 완료</div>
      <div class="suc-sub">이용해주셔서 감사합니다!<br>맛있게 드셨길 바랍니다 😊</div>
    </div>`;
}

document.getElementById('hd-table').textContent='테이블 '+tableId;
document.getElementById('hd-sub').textContent=tableInfo.type+'인석';
function updateClock(){document.getElementById('hd-clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}
setInterval(updateClock,10000);updateClock();

function updateCongHeader(){
  const keys=Object.keys(boothStateMap);
  const el=document.getElementById('hd-cong');
  if(!keys.length){el.className='cong-mini none';el.textContent='주문 없음';return;}
  const waits=keys.map(k=>boothStateMap[k]?.wait||0);
  const avg=Math.round(waits.reduce((a,b)=>a+b,0)/waits.length);
  const l=avg<=5?'low':avg<=11?'mid':'high';
  el.className='cong-mini '+l;
  el.textContent='● '+(l==='low'?'여유':l==='mid'?'보통':'혼잡')+' · '+avg+'분';
}

window.addEventListener('load', async ()=>{
  const ok=initFirebase();
  const bar=document.getElementById('conn-bar');
  if(!ok){bar.style.cssText='background:var(--rl);color:var(--rd);padding:6px 18px;font-size:11px';bar.textContent='⚠ Firebase 미설정';return;}
  fbReady=true;
  db.ref('.info/connected').on('value',snap=>{const c=snap.val();bar.className='conn-bar'+(c?' ok':'');bar.innerHTML=`<div class="conn-dot"></div><span>${c?'실시간 연결됨':'재연결 중...'}</span>`;});
  // ── 체크아웃 후 재접속 차단 ──
  // 1차: Firebase에서 해당 좌석의 checkedOut 상태 확인 (서버 기반 - 다기기 차단)
  const seatSnap = await db.ref('seats/'+tableId).get();
  const seatData = seatSnap.val();
  
  if(seatData && seatData.checkedOut === true){
    // 체크아웃 후 30분 이내인지 확인
    const elapsed = seatData.checkedOutAt ? Date.now() - seatData.checkedOutAt : 0;
    if(elapsed < 30 * 60 * 1000){
      showBlockedScreen();
      return;
    } else {
      // 30분 경과 → Firebase 초기화 후 정상 이용 허용
      await db.ref('seats/'+tableId).remove();
      localStorage.removeItem('dku_checkout_'+tableId);
    }
  }

  // 2차: localStorage 확인 (같은 기기 빠른 재접속 차단)
  const checkoutTs = localStorage.getItem('dku_checkout_'+tableId);
  if(checkoutTs){
    const elapsed = Date.now() - parseInt(checkoutTs);
    if(elapsed < 30 * 60 * 1000){
      showBlockedScreen();
      return;
    } else {
      localStorage.removeItem('dku_checkout_'+tableId);
    }
  }

  setSeat(tableId,{occupied:true,since:session.startTs,endTs:session.endTs});
  db.ref('soldout').on('value',snap=>{soldoutMap=snap.val()||{};if(currentBoothId)renderMenu(currentBoothId);});
  db.ref('boothState').on('value',snap=>{
    boothStateMap=snap.val()||{};updateCongHeader();
    if(!currentBoothId)renderBooth();
    else{const w=document.getElementById('booth-wait-label');if(w){const bw=boothStateMap[currentBoothId]?.wait||0;const l=bw===0?'none':bw<=5?'low':bw<=11?'mid':'high';w.className='bc-wait '+l;w.textContent=bw===0?'대기 없음':'● '+(l==='low'?'여유':l==='mid'?'보통':'혼잡')+' · 약 '+bw+'분 대기';}}
  });
  db.ref('orders').on('value',snap=>{if(!Object.keys(trackedOrders).length&&!getSavedOrderIds().length)return;const data=snap.val()||{};getSavedOrderIds().forEach(id=>{if(data[id]){trackedOrders[id]=data[id];}});renderTracker();});
  getSavedOrderIds().forEach(id=>subscribeOrder(id));
  renderBooth();
});

function subscribeOrder(orderId){
  db.ref('orders/'+orderId).on('value',snap=>{
    const order=snap.val();
    if(order){trackedOrders[orderId]=order;}else{delete trackedOrders[orderId];}
    renderTracker();
  });
}

function renderTracker(){
  const orders=Object.values(trackedOrders);
  if(!orders.length){document.getElementById('order-tracker').style.display='none';return;}
  const allItems=orders.flatMap(o=>o.items||[]);
  const allDone=allItems.length>0&&allItems.every(it=>it.done);
  const pendingCount=allItems.filter(it=>!it.done).length;
  const tracker=document.getElementById('order-tracker');
  tracker.style.display='block';
  tracker.className='order-tracker '+(allDone?'all-done':'has-pending');
  const badge=document.getElementById('tracker-badge');
  badge.className='tracker-badge '+(allDone?'done':'pending');
  badge.textContent=allDone?'✓ 전체 완료':`준비중 ${pendingCount}개`;
  const cartBar=document.getElementById('cart-bar');
  if(cartBar.style.display!=='none')cartBar.style.bottom=trackerOpen?'210px':'62px';
  document.getElementById('tracker-body').innerHTML=orders.map(o=>`
    <div class="tracker-order-group">
      <div class="tog-booth">${o.booth} · ${o.time}</div>
      ${(o.items||[]).map((it,i)=>`
        <div class="tog-item${it.done?' done-row':''}">
          <span class="tog-num${it.done?' done':''}">${it.num}</span>
          <span class="tog-name">${it.n} ×${it.qty}</span>
          <span class="tog-status ${it.done?'ready':'waiting'}">${it.done?'✓ 완료':'준비중'}</span>
        </div>`).join('')}
    </div>`).join('')+(allDone?`<button class="tracker-clear" onclick="clearTracker()">완료된 주문 지우기</button>`:'');
}

function toggleTracker(){
  trackerOpen=!trackerOpen;
  document.getElementById('tracker-body').className='tracker-body'+(trackerOpen?' open':'');
  document.getElementById('tracker-toggle').textContent=trackerOpen?'▼ 접기':'▲ 펼치기';
  const cartBar=document.getElementById('cart-bar');
  if(cartBar.style.display!=='none')cartBar.style.bottom=trackerOpen?'210px':'62px';
}

function clearTracker(){clearSavedOrderIds();trackedOrders={};trackerOpen=false;document.getElementById('tracker-body').className='tracker-body';document.getElementById('tracker-toggle').textContent='▲ 펼치기';document.getElementById('order-tracker').style.display='none';}

function setStep(n){[1,2,3].forEach(i=>{document.getElementById('step'+i).className='step'+(i===n?' active':i<n?' done':'');});[1,2].forEach(i=>{const l=document.getElementById('sl'+i);if(l)l.className='step-line'+(i<n?' done':'');});}

let cart={},currentBoothId=null,payMethod='kakao';
function cartCount(){let cnt=0,total=0;Object.values(cart).forEach(b=>Object.values(b).forEach(it=>{cnt+=it.qty;total+=it.p*it.qty;}));return{cnt,total};}

function renderBooth(){
  if(currentBoothId)return;
  setStep(1);document.getElementById('cart-bar').style.display='none';
  const minO=tableInfo.minOrder;
  document.getElementById('content').innerHTML=`<div class="booth-picker"><div class="picker-title">어느 부스에서 주문하시겠어요?</div>${minO>1&&!isAdditionalOrder?`<div class="min-notice">⚠ ${tableInfo.type}인석은 전체 메뉴 합산 최소 ${minO}개 주문이 필요합니다</div>`:''}${BOOTHS.map(b=>{const s=boothStateMap[b.id];const w=s?.wait||0;const hasO=!!s&&s.orders>0;const l=!hasO?'none':w<=5?'low':w<=11?'mid':'high';return`<div class="booth-card" onclick="selectBooth('${b.id}')"><div><div class="bc-name">${b.name}</div><div class="bc-wait ${l}">${!hasO?'대기 없음':'● '+(l==='low'?'여유':l==='mid'?'보통':'혼잡')+' · 약 '+w+'분'}</div></div><span style="font-size:20px;color:var(--t3)">›</span></div>`;}).join('')}</div>`;
}

function selectBooth(id){currentBoothId=id;if(!cart[id])cart[id]={};renderMenu(id);}

function renderMenu(id){
  setStep(2);
  const b=BOOTHS.find(x=>x.id===id);
  const s=boothStateMap[id];const w=s?.wait||0;const hasO=!!s&&s.orders>0;
  const l=!hasO?'none':w<=5?'low':w<=11?'mid':'high';
  const popular=s?.popular||{};
  // 부스에서 가장 많이 주문된 메뉴 1개만 인기메뉴
  const popularEntries=Object.entries(popular).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const topMenuName=popularEntries.length>0?popularEntries[0][0]:null;
  document.getElementById('content').innerHTML=`<div class="menu-section"><div class="booth-hd"><button class="back-btn" onclick="currentBoothId=null;cart={};renderBooth()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div><div style="font-size:16px;font-weight:700">${b.name}</div><div id="booth-wait-label" class="bc-wait ${l}">${!hasO?'대기 없음':'● '+(l==='low'?'여유':l==='mid'?'보통':'혼잡')+' · 약 '+w+'분 대기'}</div></div></div>${b.items.map((item,i)=>{const qty=cart[id][item.n]?.qty||0;const key=id+'::'+item.n;const isSold=soldoutMap[key]===true;const isPop=topMenuName===item.n&&!isSold&&(popular[item.n]||0)>0;return`<div class="menu-item"><div class="mi-info"><div class="mi-name-row"><span class="mi-name">${item.n}</span>${isPop?'<span class="badge-pop">🔥 인기</span>':''}${isSold?'<span class="badge-sold">품절</span>':''}</div><div class="mi-price">${item.p.toLocaleString()}원</div></div>${isSold?'<div style="font-size:12px;color:var(--rd);font-weight:500;flex-shrink:0">품절</div>':`<div class="qty-ctrl"><button class="qty-btn sub" id="sub-${i}" onclick="chgQty('${id}',${i},'${item.n}',${item.p},-1)" ${qty===0?'disabled':''}>−</button><span class="qty-num" id="qn-${i}">${qty}</span><button class="qty-btn add" onclick="chgQty('${id}',${i},'${item.n}',${item.p},1)">+</button></div>`}</div>`;}).join('')}</div>`;
  document.getElementById('cart-bar').style.display='block';
  document.getElementById('cart-bar').style.bottom=trackerOpen?'210px':'62px';
  updateCartBar();
}

function chgQty(bid,idx,name,price,delta){
  if(soldoutMap[bid+'::'+name]===true&&delta>0){alert('방금 품절 처리된 메뉴입니다.');renderMenu(bid);return;}
  if(!cart[bid])cart[bid]={};
  const nw=Math.max(0,(cart[bid][name]?.qty||0)+delta);
  if(nw===0)delete cart[bid][name];else cart[bid][name]={n:name,p:price,qty:nw};
  const el=document.getElementById('qn-'+idx);if(el)el.textContent=nw;
  const sub=document.getElementById('sub-'+idx);if(sub)sub.disabled=nw===0;
  updateCartBar();
}

function updateCartBar(){
  const{cnt,total}=cartCount();
  const minO=isAdditionalOrder?1:tableInfo.minOrder;
  const ok=cnt>=minO;
  const warnMsg=isAdditionalOrder?cnt+'개 선택':(cnt<minO?`전체 ${minO}개 이상 필요 (현재 ${cnt}개)`:cnt+'개 선택');
  document.getElementById('cart-bar').innerHTML=`<div class="cart-summary"><span class="${ok?'':'min-warn'}">${warnMsg}</span><span class="cart-tv">${total.toLocaleString()}원</span></div><button class="next-btn" ${!ok?'disabled':''} onclick="goCart()">주문 확인하기</button>`;
}

function goCart(){
  setStep(3);document.getElementById('cart-bar').style.display='none';
  // 전체 카트(모든 부스) 합산
  const allItems=[];
  Object.entries(cart).forEach(([bid,items])=>{
    const b=BOOTHS.find(x=>x.id===bid);
    Object.values(items).forEach(it=>allItems.push({...it,boothName:b?b.name:'',boothId:bid}));
  });
  const total=allItems.reduce((a,i)=>a+i.p*i.qty,0);
  // 부스별 그룹으로 표시
  const byBooth={};
  allItems.forEach(it=>{if(!byBooth[it.boothId])byBooth[it.boothId]=[];byBooth[it.boothId].push(it);});
  const itemsHtml=Object.entries(byBooth).map(([bid,items])=>{
    const bName=items[0].boothName;
    return`<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:700;color:var(--t3);margin-bottom:4px;padding:4px 0;border-bottom:1px solid var(--b)">${bName}</div>${items.map(it=>`<div class="ci-row"><span class="ci-name">${it.n}</span><span class="ci-qty">×${it.qty}</span><span class="ci-price">${(it.p*it.qty).toLocaleString()}원</span><button class="ci-rm" onclick="rmItem('${it.boothId}','${it.n}')">×</button></div>`).join('')}</div>`;
  }).join('');
  document.getElementById('content').innerHTML=`<div class="cart-review"><div class="sect-title">주문 내역 전체</div>${itemsHtml}<div class="total-row"><span>합계</span><span class="total-p">${total.toLocaleString()}원</span></div><div class="pay-label">결제 수단</div><div class="pay-methods"><button class="pay-btn2 active" id="pm-kakao" onclick="setPay('kakao')">카카오페이</button><button class="pay-btn2" id="pm-toss" onclick="setPay('toss')">토스</button><button class="pay-btn2" id="pm-card" onclick="setPay('card')">신용카드</button></div><button class="next-btn" onclick="doPayment()">결제하기 · ${total.toLocaleString()}원</button></div>`;
  payMethod='kakao';
}

function setPay(m){payMethod=m;['kakao','toss','card'].forEach(x=>{const el=document.getElementById('pm-'+x);if(el)el.className='pay-btn2'+(x===m?' active':'');});}
function rmItem(boothId,name){
  if(cart[boothId])delete cart[boothId][name];
  if(cart[boothId]&&Object.keys(cart[boothId]).length===0)delete cart[boothId];
  const{cnt}=cartCount();
  if(cnt===0){currentBoothId=null;renderBooth();}
  else if(cnt<tableInfo.minOrder){goCart();}
  else{goCart();}
}

async function doPayment(){
  if(!fbReady){alert('서버에 연결되지 않았습니다.');return;}
  // 전체 카트에서 부스별 아이템 수집
  const allItems=[];
  Object.entries(cart).forEach(([bid,items])=>{
    Object.values(items).forEach(it=>allItems.push({...it,boothId:bid}));
  });
  if(!allItems.length)return;
  // 품절 확인
  const soldItems=allItems.filter(it=>soldoutMap[it.boothId+'::'+it.n]===true);
  if(soldItems.length){alert('품절된 메뉴가 포함되어 있습니다:\n'+soldItems.map(i=>i.n).join(', '));return;}
  const total=allItems.reduce((a,i)=>a+i.p*i.qty,0);
  // 하위 호환을 위해 items 변수 유지
  const items=allItems;
  const now=new Date();
  const timeStr=now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  const baseNum=await nextOrderNum();
  if(items.length>1)await REF.counter().set(baseNum+items.length-1);
  const assignedItems=items.map((it,i)=>({n:it.n,p:it.p,qty:it.qty,boothId:it.boothId,num:baseNum+i,done:false}));
  const orderId='ord_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  // 대표 부스명 (여러 부스면 '복수 부스')
  const boothIds=[...new Set(items.map(i=>i.boothId))];
  const boothLabel=boothIds.length===1?(BOOTHS.find(b=>b.id===boothIds[0])?.name||boothIds[0]):'복수 부스';
  const order={id:orderId,booth:boothLabel,boothId:boothIds[0],table:tableId,items:assignedItems,total,time:timeStr,pay:payMethod,ts:Date.now()};
  await saveOrder(order);
  addSavedOrderId(orderId);
  subscribeOrder(orderId);
  // 부스별로 상태 업데이트
  for(const bid of boothIds){
    const boothItems=assignedItems.filter(it=>it.boothId===bid);
    const bTotal=boothItems.reduce((a,i)=>a+i.p*i.qty,0);
    const cur=boothStateMap[bid]||{orders:0,wait:0,revenue:0,popular:{}};
    const popular={...(cur.popular||{})};
    boothItems.forEach(it=>{popular[it.n]=(popular[it.n]||0)+it.qty;});
    await updateBoothState(bid,{orders:(cur.orders||0)+1,revenue:(cur.revenue||0)+bTotal,wait:Math.min(25,((cur.orders||0)+1)*2),popular});
  }
  cart={};currentBoothId=null;
  document.getElementById('steps').style.display='none';
  document.getElementById('cart-bar').style.display='none';
  document.getElementById('content').innerHTML=`<div class="suc-screen"><div class="suc-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div class="suc-title">주문 완료!</div><div class="suc-sub">아래 <strong>내 주문 현황</strong>에서<br>번호가 완료로 바뀌면 수령하세요</div><button class="extra-btn" onclick="resetOrder()">추가 주문하기</button></div>`;
  trackerOpen=true;document.getElementById('tracker-body').className='tracker-body open';document.getElementById('tracker-toggle').textContent='▼ 접기';
}

function resetOrder(){document.getElementById('steps').style.display='flex';cart={};currentBoothId=null;isAdditionalOrder=true;renderBooth();}
</script>
