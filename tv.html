<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단국대 학식당 — TV 화면</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=DM+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--g:#1a7a5e;--gl:#e8f5f0;--am:#c97c2a;--rd:#c0392b;--bg:#0d1117;--s:#161b22;--b:#30363d;--t:#e6edf3;--t2:#8b949e;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:'Noto Sans KR',sans-serif;overflow:hidden}
.tv-wrap{height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:16px;gap:12px}

/* TOP BAR */
.tv-top{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--s);border:1px solid var(--b);border-radius:10px}
.tv-logo{font-size:18px;font-weight:900;color:var(--t);display:flex;align-items:center;gap:10px}
.tv-logo-dot{width:10px;height:10px;border-radius:50%;background:#4caf8a;animation:pulse2 1.5s infinite}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.4}}
.tv-time{font-family:'DM Mono',monospace;font-size:28px;font-weight:700;color:var(--t)}
.tv-date{font-size:13px;color:var(--t2);text-align:right;margin-top:2px}

/* MAIN */
.tv-main{display:grid;grid-template-columns:1fr 380px;gap:12px;min-height:0}

/* ORDER NUMBERS */
.orders-panel{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:16px;display:flex;flex-direction:column;overflow:hidden}
.panel-title{font-size:13px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.numbers-area{flex:1;overflow:hidden}
.booth-section{margin-bottom:14px}
.booth-label{font-size:12px;color:var(--t2);margin-bottom:6px;font-weight:500}
.num-chips{display:flex;flex-wrap:wrap;gap:8px}
.num-chip{font-family:'DM Mono',monospace;font-size:22px;font-weight:700;padding:8px 16px;border-radius:8px;min-width:62px;text-align:center;background:#21262d;color:var(--t);border:1px solid var(--b);transition:all .3s}
.num-chip.ready{background:var(--g);color:#fff;border-color:var(--g);animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1.15)}100%{transform:scale(1)}}
.num-chip.done{background:#21262d;color:var(--t2);border-color:var(--b);text-decoration:line-through;opacity:.5}

/* CONG SIDEBAR */
.cong-sidebar{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.cong-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#21262d;border-radius:8px;border:1px solid var(--b)}
.ci-name{font-size:13px;font-weight:700}
.ci-right{text-align:right}
.ci-badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.ci-badge.low{background:#1a4731;color:#4caf8a}
.ci-badge.mid{background:#3d2b05;color:#e09028}
.ci-badge.high{background:#3d1515;color:#e05252}
.ci-wait{font-size:18px;font-weight:700;font-family:'DM Mono',monospace;color:var(--t)}
.ci-wait span{font-size:11px;font-weight:400;color:var(--t2)}

/* BOTTOM */
.tv-bottom{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.seat-zone{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:10px 14px}
.sz-title{font-size:11px;color:var(--t2);margin-bottom:7px;font-weight:500}
.sz-chips{display:flex;flex-wrap:wrap;gap:5px}
.sz-chip{padding:4px 9px;border:1px solid var(--b);border-radius:6px;font-size:11px;font-weight:700;color:var(--t2);background:#21262d}
.sz-chip.occ{background:var(--g);border-color:var(--g);color:#fff}
.sz-chip.exp{background:#3d2b05;border-color:var(--am);color:var(--am)}
</style>
</head>
<body>
<div class="tv-wrap">
  <div class="tv-top">
    <div class="tv-logo"><div class="tv-logo-dot"></div>단국대학교 학식당 · 죽전캠퍼스</div>
    <div><div class="tv-time" id="tv-time">00:00</div><div class="tv-date" id="tv-date"></div></div>
  </div>

  <div class="tv-main">
    <div class="orders-panel">
      <div class="panel-title">주문 번호 현황 — 번호가 초록색이면 수령 가능</div>
      <div class="numbers-area" id="numbers-area"></div>
    </div>
    <div class="cong-sidebar" id="cong-sidebar"></div>
  </div>

  <div class="tv-bottom" id="tv-bottom"></div>
</div>

<script src="data.js"></script>
<script>
const ORDERS='dku_orders',SK='dku_state',SEATS='dku_seats';
const lsa=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch{return[]}};
const ls=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch{return{}}};

function lv(w){return w<=5?'low':w<=11?'mid':'high'}
function lvL(l){return l==='low'?'여유':l==='mid'?'보통':'혼잡'}

function tick(){
  const n=new Date();
  document.getElementById('tv-time').textContent=n.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('tv-date').textContent=n.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
}
setInterval(tick,1000);tick();

function renderNumbers(){
  const orders=lsa(ORDERS);
  // group by booth, show only recent (last 2hrs)
  const cutoff=Date.now()-2*60*60*1000;
  const recent=orders.filter(o=>o.ts>cutoff);
  const byBooth={};
  BOOTHS.forEach(b=>{byBooth[b.id]={name:b.name,items:[]};});
  recent.forEach(o=>{
    if(byBooth[o.boothId]){
      (o.items||[]).forEach(it=>byBooth[o.boothId].items.push(it));
    }
  });
  document.getElementById('numbers-area').innerHTML=Object.entries(byBooth)
    .filter(([,{items}])=>items.length>0)
    .map(([,{name,items}])=>`
      <div class="booth-section">
        <div class="booth-label">${name}</div>
        <div class="num-chips">
          ${items.map(it=>`<div class="num-chip${it.done?' done':''}">${it.num}</div>`).join('')}
        </div>
      </div>`).join('') || '<div style="color:var(--t2);font-size:14px;padding:20px">주문 없음</div>';
}

function renderCong(){
  const st=ls(SK);
  document.getElementById('cong-sidebar').innerHTML=BOOTHS.map(b=>{
    const w=st[b.id]?.wait||BASE_WAIT[b.id];
    const l=lv(w);
    return`<div class="cong-item">
      <div class="ci-name">${b.name}</div>
      <div class="ci-right">
        <span class="ci-badge ${l}">${lvL(l)}</span>
        <div class="ci-wait">${w}<span>분</span></div>
      </div>
    </div>`;
  }).join('');
}

function renderSeats(){
  const seats=ls(SEATS);
  const zones={A:'A (1인석)',B:'B (2인석)',C:'C (4인석)',D:'D (6인석)'};
  const grouped={};
  TABLES.forEach(t=>{if(!grouped[t.zone])grouped[t.zone]=[];grouped[t.zone].push(t);});
  document.getElementById('tv-bottom').innerHTML=Object.entries(grouped).map(([z,tables])=>`
    <div class="seat-zone">
      <div class="sz-title">${zones[z]||z}</div>
      <div class="sz-chips">${tables.map(t=>{
        const s=seats[t.id];
        const occ=s?.occupied;
        const rem=occ&&s.endTs?Math.max(0,Math.floor((s.endTs-Date.now())/60000)):0;
        const exp=occ&&rem<=10&&rem>0;
        return`<div class="sz-chip${occ?(exp?' exp':' occ'):''}">${t.id}${occ?`<br><span style="font-size:9px;font-family:'DM Mono'">${rem}m</span>`:''}</div>`;
      }).join('')}</div>
    </div>`).join('');
}

setInterval(()=>{renderNumbers();renderCong();renderSeats();},1500);
renderNumbers();renderCong();renderSeats();
</script>
</body>
</html>
