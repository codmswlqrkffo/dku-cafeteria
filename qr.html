<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단국대 학식당 — QR 인쇄</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=DM+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--g:#1a7a5e;--bg:#f5f3ee;--s:#fff;--b:#e0dbd2;--t:#1a1814;--t3:#a09b94;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t)}
.topbar{padding:16px 24px;background:var(--s);border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:15px;font-weight:700}
.topbar p{font-size:12px;color:var(--t3);margin-top:2px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.url-input{padding:7px 10px;border:1px solid var(--b);border-radius:7px;font-size:12px;font-family:'DM Mono',monospace;width:280px}
.btn{padding:8px 16px;border:none;border-radius:7px;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.btn-g{background:var(--g);color:#fff}
.btn-o{background:var(--bg);border:1px solid var(--b);color:var(--t)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px;max-width:1100px;margin:0 auto}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--s);border:2px solid var(--b);border-radius:12px;padding:18px;text-align:center;break-inside:avoid}
.qr-wrap{display:flex;justify-content:center;margin-bottom:10px}
.card-id{font-size:22px;font-weight:700;margin-bottom:2px}
.card-type{font-size:11px;color:var(--t3);margin-bottom:3px;font-family:'DM Mono',monospace}
.card-min{font-size:11px;font-weight:700;margin-bottom:4px}
.card-min.t1{color:#1a7a5e}.card-min.t4{color:#c97c2a}.card-min.t6{color:#c0392b}
.card-url{font-size:8px;color:var(--t3);word-break:break-all;font-family:'DM Mono',monospace;margin-top:6px}
.card-logo{font-size:11px;font-weight:700;color:var(--g);margin-top:5px}
@media print{
  .topbar,.controls{display:none!important}
  body{background:#fff}.grid{padding:8px;gap:8px}
  .card{border:1.5px solid #bbb;border-radius:8px;padding:12px}
}
</style>
</head>
<body>
<div class="topbar">
  <div><h1>QR 코드 인쇄 — 테이블별</h1><p>각 테이블에 부착 · QR 스캔 시 해당 좌석 자동 인식</p></div>
  <div class="controls">
    <input type="text" class="url-input" id="base-url" placeholder="https://아이디.github.io/dku-cafeteria">
    <button class="btn btn-g" onclick="gen()">QR 생성</button>
    <button class="btn btn-o" onclick="window.print()">🖨 인쇄</button>
    <a href="index.html" class="btn btn-o">← 관리자</a>
  </div>
</div>
<div class="grid" id="grid"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="data.js"></script>
<script src="firebase.js"></script>
<script>
const minLabel = (t,m) => t===1?'최소 1개':t===2?'최소 1개':t===4?'최소 3개':'최소 5개';
const minClass = t => t<=2?'t1':t===4?'t4':'t6';
function gen() {
  const base = (document.getElementById('base-url').value || window.location.href.replace('qr.html','').replace(/\/$/,''));
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  TABLES.forEach(t => {
    const url = `${base}/table.html?id=${t.id}`;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="qr-wrap" id="qw-${t.id}"></div>
      <div class="card-id">테이블 ${t.id}</div>
      <div class="card-type">${t.type}인석 · ${t.zone}구역</div>
      <div class="card-min ${minClass(t.type)}">${minLabel(t.type, t.minOrder)}</div>
      <div class="card-url">${url}</div>
      <div class="card-logo">단국대 학식당</div>`;
    grid.appendChild(card);
    new QRCode(document.getElementById('qw-'+t.id), {text:url, width:140, height:140, colorDark:'#1a1814', colorLight:'#fff', correctLevel:QRCode.CorrectLevel.H});
  });
}
window.addEventListener('load', () => {
  document.getElementById('base-url').value = window.location.href.replace('qr.html','').replace(/\/$/,'');
  gen(); // async gen
});
</script>
</body>
</html>
