<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단국대 학식당 — 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1a7a5e;--gl:#e8f5f0;--gm:#4caf8a;--am:#c97c2a;--al:#fef3e2;--rd:#c0392b;--rl:#fdf0ef;--bg:#f5f3ee;--s:#fff;--s2:#f0ede6;--b:#e0dbd2;--t:#1a1814;--t2:#6b6560;--t3:#a09b94;--r:12px;--rs:8px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
a{text-decoration:none;color:inherit}
nav{background:var(--s);border-bottom:1px solid var(--b);padding:0 22px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.logo{display:flex;align-items:center;gap:10px}
.logo-ic{width:32px;height:32px;background:var(--g);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-ic svg{width:17px;height:17px;fill:#fff}
.logo-t{font-size:14px;font-weight:700}.logo-s{font-size:10px;color:var(--t3);font-family:'DM Mono',monospace}
.nav-r{display:flex;align-items:center;gap:8px}
.nav-time{font-family:'DM Mono',monospace;font-size:12px;color:var(--t3)}
.btn{padding:7px 13px;border:none;border-radius:var(--rs);font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.btn-g{background:var(--g);color:#fff}.btn-g:hover{background:#155f49}
.btn-o{background:var(--s2);color:var(--t2);border:1px solid var(--b)}
.conn-bar{padding:6px 22px;font-size:11px;display:flex;align-items:center;gap:6px;background:var(--al);color:var(--am)}
.conn-bar.ok{background:var(--gl);color:var(--g)}
.conn-dot{width:6px;height:6px;border-radius:50%;background:var(--am);animation:blink 1s infinite;flex-shrink:0}
.conn-bar.ok .conn-dot{background:var(--g);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.tabs{display:flex;background:var(--s);border-bottom:1px solid var(--b);padding:0 22px}
.tab{padding:12px 16px;font-size:13px;font-weight:500;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--g);border-bottom-color:var(--g);font-weight:700}
.page{display:none;max-width:1080px;margin:0 auto;padding:20px 22px}
.page.active{display:block}
.live{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--rd)}
.live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--rd);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-hd h2{font-size:15px;font-weight:700}
/* CONG */
.cong-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;margin-bottom:24px}
.cong-card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:14px;transition:all .3s}
.cong-card.flash{background:#fffde7;border-color:var(--am);transform:scale(1.02)}
.cc-name{font-size:13px;font-weight:700;margin-bottom:6px}
.cbadge{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;margin-bottom:6px}
.cbadge.low{background:var(--gl);color:var(--g)}.cbadge.mid{background:var(--al);color:var(--am)}.cbadge.high{background:var(--rl);color:var(--rd)}.cbadge.none{background:var(--s2);color:var(--t3)}
.cw{font-size:24px;font-weight:700;font-family:'DM Mono',monospace;color:var(--t)}
.cw span{font-size:12px;font-weight:400;color:var(--t3)}
.co{font-size:11px;color:var(--t3);margin-top:3px}
.cbar{height:4px;background:var(--b);border-radius:2px;margin-top:8px;overflow:hidden}
.cfill{height:100%;border-radius:2px;transition:width .5s}
.cfill.low{background:var(--g)}.cfill.mid{background:var(--am)}.cfill.high{background:var(--rd)}.cfill.none{background:var(--b)}
/* SEATS */
.seats-card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:18px;margin-bottom:24px}
.zone-hd{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.seat-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.seat-chip{padding:8px 12px;border:1px solid var(--b);border-radius:var(--rs);background:var(--s);font-size:12px;font-weight:700;text-align:center;min-width:56px;transition:all .3s}
.seat-chip.occ{background:var(--g);border-color:var(--g);color:#fff}
.seat-chip.exp{background:var(--al);border-color:var(--am);color:var(--am)}
.seat-chip .stype{font-size:9px;font-weight:400;opacity:.75;display:block}
.seat-chip.occ .stype{opacity:.8}
.seat-chip .stime{font-size:9px;font-family:'DM Mono',monospace;display:block;margin-top:1px}
.leg{display:flex;gap:14px}
.leg-i{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3)}
.leg-d{width:10px;height:10px;border-radius:3px}
/* ORDERS */
.order-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.order-card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:14px;transition:border-color .3s,background .3s}
.order-card.new-flash{border-color:var(--g);background:var(--gl)}
.oc-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.oc-booth{font-size:13px;font-weight:700}
.oc-meta{font-size:11px;color:var(--t3);margin-top:2px}
.oc-total{font-size:13px;font-weight:700;font-family:'DM Mono',monospace;color:var(--g);white-space:nowrap}
.order-items{display:flex;flex-direction:column}
.oi{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--b)}
.oi:last-child{border-bottom:none}
.oi-num{font-family:'DM Mono',monospace;font-size:20px;font-weight:700;min-width:44px;color:var(--g);transition:all .2s}
.oi-num.done{color:var(--t3);text-decoration:line-through}
.oi-name{flex:1;font-size:13px}
.oi.done-row .oi-name{color:var(--t3);text-decoration:line-through}
.done-btn{padding:5px 12px;border:1px solid var(--b);border-radius:6px;background:var(--s);font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:500;cursor:pointer;color:var(--t2);white-space:nowrap;transition:all .15s}
.done-btn:hover{border-color:var(--g);color:var(--g)}
.done-btn.done{background:var(--gl);border-color:var(--gm);color:var(--g);font-weight:700}
/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:24px}
.stat-card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:14px;text-align:center}
.stat-v{font-size:22px;font-weight:700;font-family:'DM Mono',monospace}
.stat-l{font-size:10px;color:var(--t3);margin-top:3px}
/* SOLDOUT */
.sold-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sold-booth{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:14px}
.sold-booth-name{font-size:13px;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--b)}
.sold-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--b);gap:8px}
.sold-item:last-child{border-bottom:none}
.sold-item-name{flex:1;font-size:13px}
.sold-toggle{padding:4px 10px;border:1px solid var(--b);border-radius:6px;background:var(--s);font-family:'Noto Sans KR',sans-serif;font-size:11px;cursor:pointer;color:var(--t2);white-space:nowrap;transition:all .15s}
.sold-toggle.on{background:var(--rl);border-color:var(--rd);color:var(--rd);font-weight:700}
.empty-msg{font-size:13px;color:var(--t3);padding:20px 0}
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="data.js"></script>
<script src="firebase.js"></script>

<nav>
  <div class="logo">
    <div class="logo-ic"><svg viewBox="0 0 24 24"><path d="M3 9H21M3 15H21M12 3v18M7.8 3h8.4C18.9 3 21 3 21 5.64v12.72C21 21 18.9 21 16.2 21H7.8C5.1 21 3 21 3 18.36V5.64C3 3 5.1 3 7.8 3Z"/></svg></div>
    <div><div class="logo-t">단국대 학식당</div><div class="logo-s">관리자 · 죽전캠퍼스</div></div>
  </div>
  <div class="nav-r">
    <div class="nav-time" id="nav-time">00:00</div>
    <a href="qr.html" class="btn btn-g" target="_blank">🖨 QR 인쇄</a>
  </div>
</nav>

<div class="conn-bar" id="conn-bar">
  <div class="conn-dot"></div>
  <span id="conn-text">Firebase 연결 중...</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('dash')">대시보드</div>
  <div class="tab" onclick="switchTab('orders')">주문 관리</div>
  <div class="tab" onclick="switchTab('soldout')">품절 관리</div>
</div>

<div id="page-dash" class="page active">
  <br>
  <div class="sec-hd"><h2>실시간 혼잡도</h2><span class="live">LIVE</span></div>
  <div class="cong-grid" id="cong-grid"></div>
  <div class="sec-hd"><h2>좌석 현황</h2>
    <div class="leg">
      <div class="leg-i"><div class="leg-d" style="background:var(--s);border:1px solid var(--b)"></div>비어있음</div>
      <div class="leg-i"><div class="leg-d" style="background:var(--g)"></div>사용중</div>
      <div class="leg-i"><div class="leg-d" style="background:var(--al);border:1px solid var(--am)"></div>곧 만료</div>
    </div>
  </div>
  <div class="seats-card" id="seats-wrap"></div>
  <div class="sec-hd"><h2>통계</h2></div>
  <div class="stat-grid" id="stat-grid"></div>
</div>

<div id="page-orders" class="page">
  <br>
  <div class="sec-hd"><h2>주문 현황 — 완료처리하면 주문자 화면에 즉시 반영</h2><span class="live">LIVE</span></div>
  <div class="order-grid" id="order-grid"></div>
</div>

<div id="page-soldout" class="page">
  <br>
  <div class="sec-hd"><h2>품절 설정</h2><button class="btn btn-o" onclick="clearAllSoldout()">전체 해제</button></div>
  <p style="font-size:12px;color:var(--t3);margin-bottom:14px">품절 설정 즉시 주문자 화면에 반영됩니다.</p>
  <div class="sold-grid" id="sold-grid"></div>
</div>

<script>
let curTab = 'dash';
let boothState = {};
let soldoutState = {};
let seatsState = {};
let allOrders = [];
let knownOrderIds = new Set();
let fbInitialized = false;

function switchTab(t) {
  curTab = t;
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', ['dash','orders','soldout'][i] === t));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+t).classList.add('active');
}

function tick() { document.getElementById('nav-time').textContent = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }
setInterval(tick, 1000); tick();

function lv(w) { return w===0?'none':w<=5?'low':w<=11?'mid':'high'; }
function lvL(l) { return l==='none'?'주문 없음':l==='low'?'여유':l==='mid'?'보통':'혼잡'; }

/* ── FIREBASE 초기화 — DOMContentLoaded 후 바로 실행 ── */
document.addEventListener('DOMContentLoaded', () => {
  const ok = initFirebase();
  const bar = document.getElementById('conn-bar');

  if (!ok) {
    bar.style.cssText = 'background:var(--rl);color:var(--rd);padding:6px 22px;font-size:11px';
    bar.textContent = '⚠ Firebase 미설정';
    renderCong(); renderSeats(); renderStats(); renderSoldout();
    return;
  }

  fbInitialized = true;

  /* 연결 상태 */
  db.ref('.info/connected').on('value', snap => {
    const c = snap.val();
    bar.className = 'conn-bar' + (c ? ' ok' : '');
    bar.innerHTML = `<div class="conn-dot"></div><span id="conn-text">${c ? '실시간 연결됨 — 모든 기기 동기화 중' : '재연결 중...'}</span>`;
  });

  /* ── 부스 상태 구독 ── */
  db.ref('boothState').on('value', snap => {
    boothState = snap.val() || {};
    renderCong();
    renderStats();
  });

  /* ── 좌석 구독 ── */
  db.ref('seats').on('value', snap => {
    seatsState = snap.val() || {};
    renderSeats();
  });

  /* ── 주문 전체 구독 — value 이벤트로 항상 최신 상태 유지 ── */
  db.ref('orders').on('value', snap => {
    const raw = snap.val() || {};
    const list = Object.values(raw).sort((a, b) => b.ts - a.ts);

    /* 새 주문 감지 → 혼잡도 카드 flash */
    list.forEach(o => {
      if (!knownOrderIds.has(o.id) && knownOrderIds.size > 0) {
        const cc = document.getElementById('cc-' + o.boothId);
        if (cc) { cc.classList.add('flash'); setTimeout(() => cc.classList.remove('flash'), 1200); }
      }
      knownOrderIds.add(o.id);
    });

    allOrders = list;
    renderOrders();
    renderStats();
  });

  /* ── 품절 구독 — value 이벤트로 항상 최신 상태 유지 ── */
  db.ref('soldout').on('value', snap => {
    soldoutState = snap.val() || {};
    renderSoldout();
  });

  /* 초기 렌더 */
  renderCong();
  renderSeats();
  renderStats();
  renderSoldout();
});

/* ── CONG ── */
function renderCong() {
  document.getElementById('cong-grid').innerHTML = BOOTHS.map(b => {
    const s = boothState[b.id];
    const hasData = !!s;
    const w = hasData ? (s.wait || 0) : 0;
    const l = lv(w);
    const p = hasData ? Math.min(100, Math.round((w / 22) * 100)) : 0;
    return `<div class="cong-card" id="cc-${b.id}">
      <div class="cc-name">${b.name}</div>
      <span class="cbadge ${l}">${lvL(l)}</span>
      <div class="cw">${hasData ? w : '—'}<span>${hasData ? '분' : ''}</span></div>
      <div class="co">${hasData ? `주문 ${s.orders}건 · ${(s.revenue||0).toLocaleString()}원` : '주문 없음'}</div>
      <div class="cbar"><div class="cfill ${l}" style="width:${p}%"></div></div>
    </div>`;
  }).join('');
}

/* ── SEATS ── */
function renderSeats() {
  const zones = {};
  TABLES.forEach(t => { if (!zones[t.zone]) zones[t.zone] = []; zones[t.zone].push(t); });
  const zl = { A:'A구역 (1인석)', B:'B구역 (2인석)', C:'C구역 (4인석)', D:'D구역 (6인석)' };
  document.getElementById('seats-wrap').innerHTML = Object.entries(zones).map(([z, tables]) => `
    <div class="zone-hd">${zl[z] || z}</div>
    <div class="seat-row">${tables.map(t => {
      const s = seatsState[t.id];
      const occ = s?.occupied;
      const rem = occ && s.endTs ? Math.max(0, Math.floor((s.endTs - Date.now()) / 60000)) : null;
      const exp = rem !== null && rem <= 10;
      return `<div class="seat-chip${occ ? (exp ? ' exp' : ' occ') : ''}">
        ${t.id}<span class="stype">${t.type}인</span>${occ && rem !== null ? `<span class="stime">${rem}분</span>` : ''}
      </div>`;
    }).join('')}</div>`).join('');
}

/* ── ORDERS ── */
function renderOrders() {
  const el = document.getElementById('order-grid');
  if (!allOrders.length) {
    el.innerHTML = '<div class="empty-msg">주문이 없습니다</div>';
    return;
  }
  el.innerHTML = allOrders.slice(0, 60).map(o => `
    <div class="order-card" id="oc-${o.id}">
      <div class="oc-hd">
        <div>
          <div class="oc-booth">${o.booth}</div>
          <div class="oc-meta">테이블 ${o.table} · ${o.time}</div>
        </div>
        <div class="oc-total">${(o.total||0).toLocaleString()}원</div>
      </div>
      <div class="order-items">
        ${(o.items || []).map((it, idx) => `
          <div class="oi${it.done ? ' done-row' : ''}" id="oi-${o.id}-${idx}">
            <span class="oi-num${it.done ? ' done' : ''}">${it.num}</span>
            <span class="oi-name">${it.n} ×${it.qty}</span>
            <button class="done-btn${it.done ? ' done' : ''}"
              onclick="toggleDone('${o.id}', ${idx}, ${!it.done})">
              ${it.done ? '✓ 완료' : '완료처리'}
            </button>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

/* ── 완료처리 — Firebase 직접 업데이트 ── */
async function toggleDone(orderId, itemIdx, val) {
  try {
    await db.ref(`orders/${orderId}/items/${itemIdx}/done`).set(val);
    /* Firebase 구독이 자동으로 renderOrders 호출하므로 별도 렌더 불필요 */
  } catch (e) {
    console.error('완료처리 실패:', e);
    alert('완료처리 중 오류가 발생했습니다.');
  }
}

/* ── STATS ── */
function renderStats() {
  const popular = {};
  allOrders.forEach(o => (o.items || []).forEach(it => { popular[it.n] = (popular[it.n] || 0) + it.qty; }));
  const top = Object.entries(popular).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const totalRev = allOrders.reduce((a, o) => a + (o.total || 0), 0);
  const hasOrders = Object.keys(boothState).length > 0;
  const sorted = [...BOOTHS].sort((a, b) => (boothState[b.id]?.wait || 0) - (boothState[a.id]?.wait || 0));
  document.getElementById('stat-grid').innerHTML = `
    <div class="stat-card"><div class="stat-v" style="color:var(--g)">${allOrders.length}</div><div class="stat-l">총 주문 건수</div></div>
    <div class="stat-card"><div class="stat-v" style="color:var(--am)">${totalRev.toLocaleString()}</div><div class="stat-l">총 매출(원)</div></div>
    <div class="stat-card"><div class="stat-v" style="color:var(--rd);font-size:14px">${hasOrders ? sorted[0]?.name : '—'}</div><div class="stat-l">가장 혼잡한 부스</div></div>
    <div class="stat-card"><div class="stat-v" style="color:var(--g);font-size:14px">${hasOrders ? sorted[sorted.length-1]?.name : '—'}</div><div class="stat-l">가장 여유로운 부스</div></div>
    <div class="stat-card" style="grid-column:1/-1">
      <div class="stat-v" style="font-size:13px;line-height:2">${top.length ? top.map(([n,c]) => `🔥 ${n} <span style="color:var(--t3);font-size:12px">${c}건</span>`).join(' &nbsp;·&nbsp; ') : '주문 데이터 없음'}</div>
      <div class="stat-l">인기 메뉴 TOP 3</div>
    </div>`;
}

/* ── SOLDOUT ── */
function renderSoldout() {
  document.getElementById('sold-grid').innerHTML = BOOTHS.map(b => `
    <div class="sold-booth">
      <div class="sold-booth-name">${b.name}</div>
      ${b.items.map(item => {
        const key = b.id + '::' + item.n;
        const on = soldoutState[key] === true;
        return `<div class="sold-item">
          <span class="sold-item-name">${item.n}</span>
          <span style="font-size:11px;color:var(--t3);font-family:'DM Mono',monospace;flex-shrink:0;margin-right:4px">${item.p.toLocaleString()}원</span>
          <button class="sold-toggle${on ? ' on' : ''}" onclick="toggleSold('${key}')">
            ${on ? '품절' : '정상'}
          </button>
        </div>`;
      }).join('')}
    </div>`).join('');
}

/* ── 품절 토글 — Firebase에 직접 write ── */
async function toggleSold(key) {
  try {
    const isOn = soldoutState[key] === true;
    if (isOn) {
      await db.ref('soldout/' + key).remove();
    } else {
      await db.ref('soldout/' + key).set(true);
    }
    /* Firebase 구독이 자동으로 soldoutState 업데이트 + renderSoldout 호출 */
  } catch (e) {
    console.error('품절 설정 실패:', e);
    alert('품절 설정 중 오류가 발생했습니다.');
  }
}

async function clearAllSoldout() {
  try {
    await db.ref('soldout').remove();
  } catch (e) {
    console.error('전체 해제 실패:', e);
  }
}

/* 좌석 타이머 갱신 */
setInterval(() => { if (Object.keys(seatsState).length > 0) renderSeats(); }, 60000);
</script>
